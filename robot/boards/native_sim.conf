# Enable networking for Linux host using offloaded sockets
# This avoids the need for TAP devices and root privileges
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV4=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y

# Disable native ethernet tap to avoid permission issues
CONFIG_ETH_NATIVE_TAP=n

# Disable hardware-specific configs that don't apply to native_sim
CONFIG_WIFI=n
CONFIG_WIFI_ESP32=n
CONFIG_ADC=n
CONFIG_PWM=n
CONFIG_I2C=n
CONFIG_PCNT_ESP32=n
CONFIG_UART_ESP32=n
CONFIG_SERIAL_ESP32_USB=n
CONFIG_ESP_SIMPLE_BOOT=n
CONFIG_RMT_TX_ESP32=n
CONFIG_RMT_TX=n

# Disable sensor drivers that depend on HW
CONFIG_BMI160=n
CONFIG_BMI160_TRIGGER_NONE=n

# Simulation specific
CONFIG_POSIX_API=y

# Enable host C++ and Libc support
CONFIG_EXTERNAL_LIBC=y
CONFIG_EXTERNAL_LIBCPP=y
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_CPP_EXCEPTIONS=y
CONFIG_CPP_RTTI=y


# Disable embedded-specific libs that conflict with host headers
CONFIG_PICOLIBC=n
CONFIG_MINIMAL_LIBC=n
CONFIG_NEWLIB_LIBC=n



